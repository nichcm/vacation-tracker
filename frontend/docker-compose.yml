# Frontend isolado: Vite dev server com HMR.
# A API deve estar rodando no host (ex.: `docker compose up` em ../backend) na porta 3000.
# Uso: docker compose up --build   (a partir de ./frontend)
name: vacation-tracker-frontend

services:
  frontend:
    build:
      context: .
      target: dev
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://host.docker.internal:3000}
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
