# Ambiente completo de desenvolvimento: PostgreSQL + API (NestJS) + Web (React/Vite).
# Uso: docker compose up --build   (a partir da raiz do repositório)
#   Web:     http://localhost:5173
#   API:     http://localhost:3000/api
#   Swagger: http://localhost:3000/api/docs
name: vacation-tracker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-vacation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vacation}
      POSTGRES_DB: ${DB_NAME:-vacation_tracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vacation}
      DB_PASSWORD: ${DB_PASSWORD:-vacation}
      DB_NAME: ${DB_NAME:-vacation_tracker}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      # Só o código-fonte é montado: o dist/ fica dentro do container,
      # então um build no host não interfere no watch (mudanças em package.json exigem --build)
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
